name: Public source checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source inventory and release controls
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Audit the public checkout
        run: python3 tools/ci/check_public_repository.py --output .build/ci/source.json
      - name: Test build boundaries and release rejection cases
        run: python3 -m unittest discover -s tools/tests -v
      - name: Report current IPA release readiness
        run: python3 tools/release_pipeline.py readiness --output .build/ci/release-readiness.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-check-reports
          path: .build/ci/*.json
          if-no-files-found: error
          retention-days: 14

  profiles:
    name: Native saves and shortcut checks
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify bundled signed Shortcuts against their public source
        run: python3 tools/verify_release_shortcuts.py --output .build/ci/signed-shortcuts.json
      - name: Check build59 save transfers and retained shortcut ordering
        run: python3 tools/check_input_fixes59_saved_shortcuts.py --work .build/ci/input59-saves-shortcuts
      - name: Compile build59 production host for iOS15 and later
        run: python3 tools/check_input_fixes59_compile.py --work .build/ci/input59-compile
      - name: Build pinned StikJIT and isolated helper for iOS17.4 and later
        run: python3 tools/build_stikjit59.py --work .build/ci/input59-helper
      - name: Check build59 picker, input, dependency and JIT controls
        run: python3 tools/check_input_fixes59_native.py --work .build/ci/input59-native
      - name: Fetch pinned policy-test SDK
        run: python3 tools/ci/prepare_policy_sdk.py --output .build/ci/policy-sdk
      - name: Check build59 touch profile and geometry policies
        run: python3 tools/check_input_fixes59_policy.py --work .build/ci/input59-policy --sdk .build/ci/policy-sdk
      - name: Check build59 edge resizing and original build58 failure controls
        run: python3 tools/check_touch_resize59.py --work .build/ci/input59-resize
      - name: Check build59 controller suspend and resume
        run: python3 tools/check_controller_resume59.py --sdk .build/ci/policy-sdk --work .build/ci/input59-controller
      - name: Check strict UI result rejection controls
        run: python3 experiments/ios-jit/launcher-input-fixes59/tests/UIResultsValidatorTests.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-profile-check-reports
          path: |
            .build/ci/signed-shortcuts.json
            .build/ci/input59-saves-shortcuts/receipt.json
            .build/ci/input59-saves-shortcuts/*/receipt.json
            .build/ci/input59-compile/receipt.json
            .build/ci/input59-helper/receipt.json
            .build/ci/input59-native/receipt.json
            .build/ci/input59-native/*/receipt.json
            .build/ci/input59-policy/receipt.json
            .build/ci/input59-resize/receipt.json
            .build/ci/input59-controller/receipt.json
          if-no-files-found: error
          retention-days: 14
